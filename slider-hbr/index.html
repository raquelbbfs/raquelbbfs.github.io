<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Slider Horizontal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slider">
    <div class="slides">
        <img src="images/img1.jpg" class="slide">
        <img src="images/img2.jpg" class="slide">
        <img src="images/img3.jpg" class="slide">
        <img src="images/img4.jpg" class="slide">
    </div>

    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>

    <div class="indicators">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
